# ---------------------------------------------------------------
# StegLab backend configuration
# Everything is ephemeral: no database, no sessions, no persisted
# files. Temp files live only for the duration of a request.
# ---------------------------------------------------------------

server.port=8080

# Hard upload ceiling. The global exception handler translates the
# resulting MaxUploadSizeExceededException into a human message.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# Never include stack traces or exception class names in responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Tomcat should not keep uploaded parts around longer than needed.
spring.servlet.multipart.file-size-threshold=2MB

# CORS: comma-separated list of allowed browser origins.
# The Next.js dev server proxies /api/* server-side, so in the
# docker-compose setup this list is only needed for direct access.
steglab.cors.allowed-origins=http://localhost:3000

# Rate limiting for compute-heavy endpoints (requests per minute per IP).
steglab.ratelimit.requests-per-minute=10

# Populated at build/deploy time; "dev" when running locally.
steglab.git-commit=${GIT_COMMIT:dev}
steglab.version=2.0.0

# Keep multipart temp files inside the JVM temp dir, which the
# services clean up explicitly after each request.
spring.servlet.multipart.resolve-lazily=false

# Quiet, structured logs. File content and passwords are never logged.
logging.level.root=INFO
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
